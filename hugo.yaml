baseURL: "https://xiaozhang121xz.github.io/"
languageCode: "zh-cn"
title: "技术札记"
theme: "PaperMod"
defaultContentLanguage: zh
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
enableEmoji: true
hasCJKLanguage: true

outputs:
  home: [HTML, RSS, JSON]

taxonomies:
  category: categories
  tag: tags
  series: series

menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: 1
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 2
    - identifier: about
      name: 关于
      url: /about/
      weight: 3
    - identifier: categories
      name: 分类
      url: /categories/
      weight: 4
    - identifier: github
      name: GitHub
      url: "https://github.com/xiaozhang121xz"
      weight: 5

params:
  env: production
  title: "技术札记"
  description: "关于 Agent、Harness、LLM 与 AI 工程实践的中文技术博客。"
  author: "xiaozhang121xz"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  ShowFullTextinRSS: true
  ShowToc: true
  TocOpen: false
  UseHugoToc: true
  hideFooter: false
  DateFormat: "2006-01-02"
  mainSections: ["posts"]
  assets:
    disableHLJS: true
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 2
    keys: ["title", "permalink", "summary", "content"]

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
    lineNos: false
    style: github
